<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Dashboard</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8f9fa;
      color: #333;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    h1 {
      margin-top: 0;
      color: #1a1a1a;
      font-size: 1.8rem;
    }

    .search-box {
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-sizing: border-box;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    th {
      background-color: #f1f3f5;
      font-weight: 600;
    }

    tr:hover {
      background-color: #f8f9fa;
    }

    .status {
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .loading { background-color: #e7f5ff; color: #1971c2; }
    .error { background-color: #ffe3e3; color: #c92a2a; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Attendance Viewer</h1>
    <div id="status" class="status loading">Loading sheet data...</div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search by name, ID, or status..." onkeyup="filterTable()">
    </div>

    <div style="overflow-x: auto;">
      <table id="dataTable">
        <thead>
          <tr id="tableHeader"></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const sheetId = urlParams.get('sheetId');
    const statusDiv = document.getElementById('status');

    if (!sheetId) {
      statusDiv.className = 'status error';
      statusDiv.innerText = 'Error: No sheetId parameter found in the URL. Please add ?sheetId=YOUR_SPREADSHEET_ID';
    } else {
      const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv`;

      fetch(csvUrl)
        .then(response => {
          if (!response.ok) throw new Error('Failed to fetch data');
          return response.text();
        })
        .then(csvText => {
          const rows = parseCSV(csvText);
          if (rows.length > 0) {
            renderTable(rows);
            statusDiv.style.display = 'none';
          } else {
            throw new Error('Spreadsheet appears to be empty');
          }
        })
        .catch(err => {
          statusDiv.className = 'status error';
          statusDiv.innerText = 'Failed to load sheet data. Please ensure your Google Sheet is set to "Anyone with the link can view".';
          console.error(err);
        });
    }

    function parseCSV(text) {
      const lines = text.split('\n');
      return lines.map(line => {
        const result = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            result.push(current.trim());
            current = '';
          } else {
            current += char;
          }
        }
        result.push(current.trim());
        return result;
      });
    }

    function renderTable(rows) {
      const headerRow = document.getElementById('tableHeader');
      const body = document.getElementById('tableBody');

      headerRow.innerHTML = '';
      body.innerHTML = '';

      const headers = rows[0];
      headers.forEach(header => {
        const th = document.createElement('th');
        th.innerText = header.replace(/^"|"$/g, '');
        headerRow.appendChild(th);
      });

      for (let i = 1; i < rows.length; i++) {
        if (rows[i].length === 1 && rows[i][0] === '') continue;
        const tr = document.createElement('tr');
        rows[i].forEach(cell => {
          const td = document.createElement('td');
          td.innerText = cell.replace(/^"|"$/g, '');
          tr.appendChild(td);
        });
        body.appendChild(tr);
      }
    }

    function filterTable() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      const rows = document.getElementById('tableBody').getElementsByTagName('tr');

      for (let row of rows) {
        const text = row.innerText.toLowerCase();
        row.style.display = text.includes(input) ? '' : 'none';
      }
    }
  </script>
</body>
</html>
