<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Dashboard</title>
  <style>
    :root {
      --primary-color: #007bff;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333333;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    h1 {
      margin-top: 0;
      color: #1a1a1a;
      font-size: 1.8rem;
    }

    .search-box {
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-sizing: border-box;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    th {
      background-color: #f1f3f5;
      font-weight: 600;
    }

    tr:hover {
      background-color: #f8f9fa;
    }

    .status {
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .loading { background-color: #e7f5ff; color: #1971c2; }
    .error { background-color: #ffe3e3; color: #c92a2a; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Attendance Viewer</h1>
    <div id="status" class="status loading">Loading sheet data...</div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search by name, ID, or status..." onkeyup="filterTable()">
    </div>

    <div style="overflow-x: auto;">
      <table id="dataTable">
        <thead>
          <tr id="tableHeader"></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    // Extract sheetId from URL query parameters
    const urlParams = new URLSearchParams(window.location.search);
    const sheetId = urlParams.get('sheetId');
    const statusDiv = document.getElementById('status');

    if (!sheetId) {
      statusDiv.className = 'status error';
      statusDiv.innerText = 'Error: No sheetId parameter found in the URL. Please add ?sheetId=YOUR_SPREADSHEET_ID';
    } else {
      // Use gviz endpoint to fetch sheet data as JSON
      const fetchUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

      fetch(fetchUrl)
        .then(response => response.text())
        .then(data => {
          // Parse Google's JSON response wrapper
          const jsonData = JSON.parse(data.substring(47, data.length - 2));
          renderTable(jsonData.table);
          statusDiv.style.display = 'none';
        })
        .catch(err => {
          statusDiv.className = 'status error';
          statusDiv.innerText = 'Failed to load sheet data. Ensure the Google Sheet is shared as "Anyone with the link can view".';
          console.error(err);
        });
    }

    function renderTable(tableData) {
      const headerRow = document.getElementById('tableHeader');
      const body = document.getElementById('tableBody');

      // Populate Headers
      tableData.cols.forEach(col => {
        const th = document.createElement('th');
        th.innerText = col.label || '';
        headerRow.appendChild(th);
      });

      // Populate Rows
      tableData.rows.forEach(row => {
        const tr = document.createElement('tr');
        row.c.forEach(cell => {
          const td = document.createElement('td');
          td.innerText = cell ? (cell.v !== null ? cell.v : '') : '';
          tr.appendChild(td);
        });
        body.appendChild(tr);
      });
    }

    function filterTable() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      const rows = document.getElementById('tableBody').getElementsByTagName('tr');

      for (let row of rows) {
        const text = row.innerText.toLowerCase();
        row.style.display = text.includes(input) ? '' : 'none';
      }
    }
  </script>
</body>
</html>
